services:
  postgres:
    image: postgres:16
    container_name: queue_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${STUDHUB_POSTGRES_DB}
      POSTGRES_USER: ${STUDHUB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STUDHUB_POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    container_name: queue_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"

  #it is better to create Dockerfile but this is just for testing :P
  app:
    image: golang:1.25
    container_name: stud_hub_app
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCESS_SECRET_KEY: ${ACCESS_SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
    volumes:
      - ..:/app
    command: ["go", "run", "./cmd/main.go", "--config", "deploy/config.yaml"]

volumes:
  postgres_data:
