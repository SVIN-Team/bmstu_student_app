services:
  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 3
    container_name: queue_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${STUDHUB_POSTGRES_DB}
      POSTGRES_USER: ${STUDHUB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STUDHUB_POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    container_name: queue_redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: stud_hub_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING}
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING}
      ACCESS_SECRET_KEY: ${ACCESS_SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
    volumes:
      - ../deploy/config.yaml:/app/deploy/config.yaml:ro
    ports:
      - 8080:8080

volumes:
  postgres_data:
