basePath: /api/v1
definitions:
  dto.AdminUpdateUserRequest:
    properties:
      group_id:
        type: string
      is_blocked:
        type: boolean
      role:
        type: string
    type: object
  dto.AdminUpsertGroupRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.AuthRefreshResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
    type: object
  dto.AuthSignInResponse:
    properties:
      id:
        type: string
    type: object
  dto.AuthSignUpResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  dto.CreateQueueRequest:
    properties:
      closes_at:
        type: string
      lesson_id:
        type: string
      max_size:
        type: integer
      opens_at:
        type: string
      subject_id:
        type: string
    required:
    - opens_at
    - subject_id
    type: object
  dto.ErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.ErrorDetail'
      success:
        type: boolean
    type: object
  dto.GroupResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.ImportScheduleResponse:
    properties:
      created_subjects:
        items:
          type: string
        type: array
      created_teachers:
        items:
          type: string
        type: array
      errors:
        items:
          type: string
        type: array
      imported_count:
        type: integer
    type: object
  dto.LessonResponse:
    properties:
      ends_at:
        type: string
      id:
        type: string
      queue_id:
        type: string
      room:
        $ref: '#/definitions/dto.RoomResponse'
      starts_at:
        type: string
      subject:
        $ref: '#/definitions/dto.SubjectResponse'
      teacher:
        $ref: '#/definitions/dto.TeacherResponse'
      type:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.MessageResponse:
    properties:
      message:
        type: string
    type: object
  dto.PaginationResponse:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  dto.QueueListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.QueueResponse'
        type: array
      pagination:
        $ref: '#/definitions/dto.PaginationResponse'
    type: object
  dto.QueueMinimalInfo:
    properties:
      id:
        type: string
      status:
        type: string
      subject:
        $ref: '#/definitions/dto.SubjectResponse'
    type: object
  dto.QueueResponse:
    properties:
      closes_at:
        type: string
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/dto.UserMinimalResponse'
      group:
        $ref: '#/definitions/dto.GroupResponse'
      id:
        type: string
      lesson_id:
        type: string
      max_size:
        type: integer
      opens_at:
        type: string
      slots_count:
        type: integer
      status:
        type: string
      subject:
        $ref: '#/definitions/dto.SubjectResponse'
    type: object
  dto.RoomResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.SignUpRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      group_name:
        type: string
      last_name:
        type: string
      password:
        type: string
    required:
    - email
    - first_name
    - group_name
    - last_name
    - password
    type: object
  dto.SlotResponse:
    properties:
      id:
        type: string
      position:
        type: integer
      queue:
        $ref: '#/definitions/dto.QueueMinimalInfo'
      queue_id:
        type: string
      signed_up_at:
        type: string
      status:
        type: string
      student:
        $ref: '#/definitions/dto.UserMinimalResponse'
    type: object
  dto.SubjectResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.SuccessResponse:
    properties:
      data: {}
      success:
        type: boolean
    type: object
  dto.TeacherResponse:
    properties:
      full_name:
        type: string
      id:
        type: string
    type: object
  dto.TransferHeadmanRoleRequest:
    properties:
      to_user_id:
        type: string
    required:
    - to_user_id
    type: object
  dto.TransferHeadmanRoleResponse:
    properties:
      group_id:
        type: string
      new_headman_id:
        type: string
      previous_headman_id:
        type: string
    type: object
  dto.TransferSlotsRequest:
    properties:
      source_queue_id:
        type: string
    required:
    - source_queue_id
    type: object
  dto.TransferSlotsResponse:
    properties:
      slots:
        items:
          $ref: '#/definitions/dto.SlotResponse'
        type: array
      transferred_count:
        type: integer
    type: object
  dto.UpdateQueueRequest:
    properties:
      closes_at:
        type: string
      max_size:
        type: integer
      status:
        type: string
    type: object
  dto.UpdateSlotRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  dto.UpdateUserRequest:
    properties:
      first_name:
        type: string
      group_id:
        type: string
      last_name:
        type: string
    type: object
  dto.UserListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/dto.PaginationResponse'
    type: object
  dto.UserMinimalResponse:
    properties:
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      group:
        $ref: '#/definitions/dto.GroupResponse'
      id:
        type: string
      is_blocked:
        type: boolean
      last_name:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for Stud Hub backend.
  title: Stud Hub API
  version: "1.0"
paths:
  /admin/groups:
    get:
      description: Вернуть список всех существующих групп
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.GroupResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Получить все группы (Админ)
      tags:
      - Admin Groups
    post:
      consumes:
      - application/json
      description: Создать новую группу по имени
      parameters:
      - description: Create group request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminUpsertGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.GroupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Создать группу (Админ)
      tags:
      - Admin Groups
  /admin/groups/{id}:
    delete:
      description: Удалить группу насовсем, если в ней нет участников
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Удалить группу (Админ)
      tags:
      - Admin Groups
    get:
      description: Получить информацию о группе по ID
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.GroupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Получить группу по ID (Админ)
      tags:
      - Admin Groups
    patch:
      consumes:
      - application/json
      description: Обновить имя группы
      parameters:
      - description: Group ID
        in: path
        name: id
        required: true
        type: string
      - description: Update group request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminUpsertGroupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.GroupResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Обновить группу (Админ)
      tags:
      - Admin Groups
  /admin/users:
    get:
      description: Returns paginated list of users.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserListResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: List users (admin)
      tags:
      - Admin Users
  /admin/users/{id}:
    delete:
      description: Deletes user by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Delete user (admin)
      tags:
      - Admin Users
    get:
      description: Returns user details by ID.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get user by ID (admin)
      tags:
      - Admin Users
    patch:
      consumes:
      - application/json
      description: Partially updates user fields.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Admin update user request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AdminUpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Update user (admin)
      tags:
      - Admin Users
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет учетные данные пользователя и устанавливает файлы cookie
        аутентификации.
      parameters:
      - description: Signin request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthSignInResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Войти
      tags:
      - Auth
  /auth/logout:
    post:
      description: Удаляет текущий токен обновления и удаляет файлы cookie аутентификации.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MessageResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Выйти из аккаунта
      tags:
      - Auth
  /auth/logout-all:
    post:
      description: Удаляет все токены обновления и удаляет файлы cookie аутентификации.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MessageResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Выйти из аккаунта со всех устройств
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Обновляет токены доступа и обновления с помощью cookie обновления.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthRefreshResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Обновить токен через refresh_token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создает нового пользователя в существующей группе и возвращает
        данные о созданном пользователе.
      parameters:
      - description: Signup request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthSignUpResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - Auth
  /lessons:
    get:
      description: Returns lessons by group and date range.
      parameters:
      - description: Group ID (UUID). If omitted, current user's group is used.
        in: query
        name: group_id
        type: string
      - description: Start date in YYYY-MM-DD format
        in: query
        name: date_from
        required: true
        type: string
      - description: End date in YYYY-MM-DD format
        in: query
        name: date_to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.LessonResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: List lessons
      tags:
      - Lessons
  /lessons/{id}:
    get:
      description: Returns lesson details by lesson ID.
      parameters:
      - description: Lesson ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.LessonResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Get lesson by ID
      tags:
      - Lessons
  /lessons/imports:
    post:
      consumes:
      - multipart/form-data
      description: Imports lessons from uploaded JSON file (admin endpoint when enabled
        in routing).
      parameters:
      - description: JSON file with import payload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ImportScheduleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: Import schedule
      tags:
      - Lessons
  /queues:
    get:
      description: Returns queues filtered by group and status with pagination.
      parameters:
      - description: Group ID (UUID). If omitted, current user's group is used.
        in: query
        name: group_id
        type: string
      - description: Queue status filter
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.QueueListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      - CookieAuth: []
      summary: List queues
      tags:
      - Queues
    post:
      consumes:
      - application/json
      description: Creates a queue for the authenticated user's group.
      parameters:
      - description: Create queue request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateQueueRequest'
      produces:
      - application/json
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
