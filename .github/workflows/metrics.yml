name: Сбор метрик

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      packages: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      
      - name: Build collector image
        run: |
          cd git-metrics-dashboard
          docker build -t git-collector ./collector
      
      - name: Start monitoring stack
        run: |
          cd git-metrics-dashboard
          docker-compose up -d
      
      - name: Wait for services to be ready
        run: sleep 10
      
      - name: Run metrics collection
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd git-metrics-dashboard
          docker run --rm \
            --network git-metrics-dashboard_default \
            -e GITHUB_TOKEN=$GITHUB_TOKEN \
            -e PUSHGATEWAY_URL=pushgateway:9091 \
            git-collector
      
      - name: Save metrics to artifact
        if: always()
        run: |
          curl -s http://localhost:9091/metrics > metrics.txt 2>&1 || echo "No metrics" > metrics.txt
          cat metrics.txt | grep -E "lead_time|github" || echo "No lead time metrics"
      
      - name: Upload metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.txt
      
      - name: Stop monitoring stack
        if: always()
        run: |
          cd git-metrics-dashboard
          docker-compose down