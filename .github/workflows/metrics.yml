name: Lead Time Metrics Collection

on:
  push:
    branches: [ '*' ]
  schedule:
    - cron: '0 */6 * * *'  
  workflow_dispatch:  

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build collector image
        run: |
          cd git-metrics-dashboard
          docker build -t git-collector ./collector
      
      - name: Start monitoring stack
        run: |
          cd git-metrics-dashboard
          docker-compose up -d
      
      - name: Run metrics collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd git-metrics-dashboard
          docker run --rm \
            --network git-metrics-dashboard_default \
            -e GITHUB_TOKEN=$GITHUB_TOKEN \
            -e PUSHGATEWAY_URL=pushgateway:9091 \
            git-collector
      
      - name: Upload metrics to artifacts (для отладки)
        if: always()
        run: |
          curl http://localhost:9091/metrics > metrics.txt
      
      - name: Stop monitoring stack
        if: always()
        run: |
          cd git-metrics-dashboard
          docker-compose down