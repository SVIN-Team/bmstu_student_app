name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stud_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Download dependencies
        working-directory: ./backend
        run: go mod download
      
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test_user; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done
      
      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            if redis-cli -h localhost -p 6379 ping; then
              echo "Redis is ready"
              break
            fi
            sleep 2
          done
      
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ./backend
      
      - name: Run unit tests
        working-directory: ./backend
        run: go test --tags=unit -v ./...
      
      - name: Run integration tests
        working-directory: ./backend
        run: go test --tags=integration -v ./...
      
      - name: Run E2E tests
        working-directory: ./backend
        run: go test --tags=e2e -v ./test/e2e/...
      
      - name: Build binary
        working-directory: ./backend
        run: go build -v -o bmstu_app cmd/main.go
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmstu_app_binary
          path: ./backend/bmstu_app
          retention-days: 7

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref_name == 'develop')
      || github.event_name == 'workflow_dispatch'
    needs: build-and-test
    
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: bmstu_app_binary
          path: ./artifact
      
      - name: Make binary executable
        run: chmod +x ./artifact/bmstu_app
      
      - name: Copy binary to VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "./artifact/bmstu_app"
          target: "/home/${{ secrets.DEPLOY_USER }}/bmstu_app/"
          strip_components: 2
      
      - name: Restart application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            sudo systemctl restart bmstu_app
            sleep 3
            sudo systemctl status bmstu_app --no-pager

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    
    steps:
      - name: Check /api/v1/health endpoint
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            http://${{ secrets.DEPLOY_HOST }}:8080/api/v1/health || exit 1
      
      - name: Health check passed
        if: success()
        run: echo "Application is healthy!"
      
      - name: Health check failed
        if: failure()
        run: echo "Health check failed! Check the application."