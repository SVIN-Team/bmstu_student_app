---
name: "AI Ревью с проверкой по ТЗ"

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - develop
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  load-tz:
    runs-on: ubuntu-latest
    outputs:
      tz_content: ${{ steps.get-tz.outputs.tz_content }}
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v3
        with:
          ref: develop
          fetch-depth: 1

      - name: Get TZ from docs/tz.md
        id: get-tz
        run: |
          if [ -f "docs/tz.md" ]; then
            TZ_CONTENT=$(cat docs/tz.md)
            echo "tz_content<<EOF" >> $GITHUB_OUTPUT
            echo "$TZ_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ ТЗ загружено из docs/tz.md"
          else
            echo "❌ Файл docs/tz.md не найден!"
            exit 1
          fi

  review-issue:
    needs: load-tz
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Установка и запуск Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          curl --retry 5 --retry-delay 5 \
            --retry-connrefused http://localhost:11434/api/tags
          ollama pull llama2:7b

      - name: Получение данных issue
        id: issue_data
        run: |
          echo "TITLE=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          echo "BODY=${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
          echo "NUMBER=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Проверка тикета на соответствие ТЗ
        id: check_issue
        env:
          TZ_CONTENT: ${{ needs.load-tz.outputs.tz_content }}
        run: |
          cat > prompt.txt << 'EOF'
          Ты - эксперт по проверке тикетов.
          ТЕХНИЧЕСКОЕ ЗАДАНИЕ:
          $TZ_CONTENT
          ТИКЕТ:
          Название: ${{ steps.issue_data.outputs.TITLE }}
          Описание: ${{ steps.issue_data.outputs.BODY }}
          Проанализируй тикет и ответь:
          1. Соответствует ли тикет требованиям из ТЗ?
          2. Какие разделы ТЗ относятся к этому тикету?
          3. Всё ли учтено из ТЗ?
          4. Чего не хватает?
          5. Оценка соответствия от 1 до 10
          Дай рекомендации по улучшению.
          EOF

          REVIEW=$(ollama run llama2:7b "$(cat prompt.txt)")

          cat > issue_review.txt << EOF
          ## AI Ревью тикета #${{ steps.issue_data.outputs.NUMBER }}

          **Заголовок:** ${{ steps.issue_data.outputs.TITLE }}

          ### Проверка соответствия Техническому заданию:

          $REVIEW

          ### Связанные разделы ТЗ:
          - Раздел 2.3 (Роли пользователей)
          - Раздел 3.3 (Модель данных)
          - Раздел 3.4 (Авторизация)

          ---
          *Проверено по ТЗ из docs/tz.md*
          EOF

      - name: Опубликовать результат в тикет
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('issue_review.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review
            });

  review-pr:
    needs: load-tz
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Установка и запуск Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          curl --retry 5 --retry-delay 5 \
            --retry-connrefused http://localhost:11434/api/tags
          ollama pull deepseek-coder:6.7b-instruct
          ollama pull llama2:7b

      - name: Получение данных PR
        id: pr_data
        run: |
          echo "TITLE=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "${{ github.event.pull_request.body }}" > pr_body.txt
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          cat pr_body.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "NUMBER=${{ github.event.pull_request.number }}" \
            >> $GITHUB_OUTPUT
          echo "BRANCH=${{ github.event.pull_request.head.ref }}" \
            >> $GITHUB_OUTPUT
          ISSUE_NUMBER=$(grep -oE '#[0-9]+' pr_body.txt | head -1 | tr -d '#')
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Получение измененных файлов
        id: files
        run: |
          FILES=$(git diff --name-only \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }})
          echo "FILES<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "COUNT=$(echo "$FILES" | wc -l)" >> $GITHUB_OUTPUT

      - name: Проверка документации в /docs/
        id: check_docs
        run: |
          echo "### Проверка документации" > docs_review.txt
          DOCS_CHANGED=$(echo "${{ steps.files.outputs.FILES }}" | \
            grep "^docs/" || true)

          if [ -n "$DOCS_CHANGED" ]; then
            echo "**Изменения в документации:**" >> docs_review.txt
            for file in $DOCS_CHANGED; do
              if [ -f "$file" ]; then
                echo -e "\n#### Файл: \`$file\`" >> docs_review.txt
                CONTENT=$(cat "$file" | head -500)
                REVIEW=$(ollama run llama2:7b \
                  "Проверь документацию:
          Файл: $file
          Содержимое:
          $CONTENT
          Оцени:
          1. Понятность
          2. Полнота
          3. Соответствие реальности
          4. Нужны ли исправления
          Ответь на только на русском языке.")
                          echo "$REVIEW" >> docs_review.txt
                        fi
                      done
                    else
                      echo "Изменений в документации нет" >> docs_review.txt
                    fi

      - name: Анализ кода на соответствие ТЗ
        id: code_review
        env:
          TZ_CONTENT: ${{ needs.load-tz.outputs.tz_content }}
        run: |
          cat > full_review.txt << 'EOF'
          ## Полное AI Ревью PR #${{ steps.pr_data.outputs.NUMBER }}
          **Заголовок:** ${{ steps.pr_data.outputs.TITLE }}
          **Ветка:** ${{ steps.pr_data.outputs.BRANCH }}
          **Изменено файлов:** ${{ steps.files.outputs.COUNT }}
          ---
          ### Проверка по Техническому заданию:
          **ТЗ загружено из:** `docs/tz.md`
          EOF
          echo -e "\n### 🔍 Анализ изменений:\n" >> full_review.txt
          FILES_LIST="${{ steps.files.outputs.FILES }}"
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo -e "\n#### Файл: \`$file\`" >> full_review.txt
              if [[ "$file" == *.go ]]; then
                CONTENT=$(cat "$file" | head -500)
                if [[ "$file" == *"model"* ]] || \
                  [[ "$file" == *"entity"* ]]; then
                  TZ_SECTION=$(echo "$TZ_CONTENT" | grep -A 100 "3\.3" | \
                    grep -B 10 -A 50 "Таблица" || echo "Раздел 3.3 не найден")
                  REVIEW=$(ollama run codellama:7b-instruct \
                    "Ты - эксперт по проверке моделей данных.
                    Сравни этот код с разделом 3.3 ТЗ.
                    КОД (модель данных):
                    \`\`\`go
                    $CONTENT
                    \`\`\`
                    ТЗ (раздел 3.3 Модель данных):
                    $TZ_SECTION
                    Проанализируй и ответь на русском языке:
                    1. Какая таблица БД соответствует этой модели?
                    2. Все ли поля из ТЗ присутствуют?
                    3. Правильные ли типы данных?
                    4. Есть ли нужные теги и индексы?
                    5. Соответствуют ли ограничения требованиям?
                    Если это не модель данных - кратко опиши назначение.")
                elif [[ "$file" == *"repository"* ]] || \
                    [[ "$file" == *"repo"* ]]; then
                  TZ_SECTION=$(echo "$TZ_CONTENT" | grep -A 30 "3\.3" | \
                    grep -A 20 "Индексы\|Ограничения" || \
                    echo "Информация не найдена")
                  REVIEW=$(ollama run codellama:7b-instruct \
                    "Ты - эксперт по проверке репозиториев.
                    Сравни этот код с разделом 3.3 ТЗ.
                    КОД (репозиторий):
                    \`\`\`go
                    $CONTENT
                    \`\`\`
                    ТЗ (ограничения целостности и индексы):
                    $TZ_SECTION
                    Проанализируй и ответь на русском:
                    1. Какие методы работы с БД реализованы?
                    2. Есть ли проверки целостности данных?
                    3. Используются ли транзакции где нужно?
                    4. Соответствует ли код описанию из ТЗ?")
                elif [[ "$file" == *"usecase"* ]] || \
                    [[ "$file" == *"service"* ]]; then
                  TZ_SECTION=$(echo "$TZ_CONTENT" | grep -A 50 "2\.3\|3\.4" || \
                    echo "Разделы не найдены")
                  REVIEW=$(ollama run codellama:7b-instruct \
                    "Ты - эксперт по бизнес-логике ПО.
                    Сравни этот код с разделами 2.3 и 3.4 ТЗ.
                    КОД (бизнес-логика):
                    \`\`\`go
                    $CONTENT
                    \`\`\`
                    ТЗ (роли пользователей и правила доступа):
                    $TZ_SECTION
                    Проанализируй и ответь на русском:
                    1. Какие бизнес-правила реализованы?
                    2. Проверяются ли права доступа?
                    3. Обрабатываются ли все ошибки?
                    4. Соответствует ли логика описанию ролей?")
                else
                  REVIEW=$(ollama run codellama:7b-instruct \
                    "Проанализируй этот Go файл:
                    \`\`\`go
                    $CONTENT
                    \`\`\`
                    Ответь на русском кратко:
                    1. Что делает этот файл?
                    2. Есть ли очевидные ошибки?
                    3. Соответствует ли стандартам Go?")
                fi
                echo "**Анализ:**" >> full_review.txt
                echo "$REVIEW" >> full_review.txt
              elif [[ "$file" == *.js ]] || [[ "$file" == *.jsx ]]; then
                CONTENT=$(cat "$file" | head -500)
                if [[ "$file" == *"component"* ]] || \
                  [[ "$file" == *"Component"* ]]; then
                  TZ_SECTION=$(echo "$TZ_CONTENT" | grep -A 30 "2\.3" || \
                    echo "Раздел 2.3 не найден")
                  REVIEW=$(ollama run codellama:7b-instruct \
                    "Ты - эксперт по React разработке.
                    Сравни этот код с разделом 2.3 ТЗ.
                    КОД (компонент):
                    \`\`\`jsx
                    $CONTENT
                    \`\`\`
                    ТЗ (роли пользователей):
                    $TZ_SECTION
                    Проанализируй и ответь на русском:
                    1. Для какой роли этот компонент?
                    2. Реализует ли он функционал из ТЗ?
                    3. Есть ли проверка прав доступа?
                    4. Какие улучшения можно сделать?")
                else
                  REVIEW=$(ollama run codellama:7b-instruct \
                    "Проанализируй этот JS/JSX файл кратко.")
                fi
                echo "$REVIEW" >> full_review.txt
              elif [[ "$file" == *.sql ]] || \
                  [[ "$file" == *migration* ]]; then
                CONTENT=$(cat "$file")
                TZ_SECTION=$(echo "$TZ_CONTENT" | grep -A 100 "3\.3" | \
                  grep -A 50 "Таблица" || echo "Таблицы не найдены")
                REVIEW=$(ollama run codellama:7b-instruct \
                  "Ты - эксперт по SQL и миграциям БД.
                  Сравни этот код с разделом 3.3 ТЗ.
                  SQL/Миграция:
                  \`\`\`sql
                  $CONTENT
                  \`\`\`
                  ТЗ (модель данных, таблицы):
                  $TZ_SECTION
                  Проанализируй и ответь на русском:
                  1. Какие таблицы создаются/изменяются?
                  2. Соответствуют ли поля и типы данных ТЗ?
                  3. Есть ли все нужные индексы?
                  4. Правильно ли настроены внешние ключи?
                  5. Есть ли ошибки или проблемы?")
                echo "$REVIEW" >> full_review.txt
              fi
              echo -e "\n---" >> full_review.txt
            fi
          done <<< "$FILES_LIST"
          cat docs_review.txt >> full_review.txt
          echo -e "\n### 📊 Итоговая оценка:\n" >> full_review.txt
          SUMMARY=$(ollama run llama2:7b \
            "Ты - технический эксперт. Оцени этот PR.
            PR: ${{ steps.pr_data.outputs.TITLE }}
            Файлов: ${{ steps.files.outputs.COUNT }}
            Ответь строго по пунктам на русском:
            1. Соответствие ТЗ (оценка 1-10 и почему)
            2. Что сделано хорошо
            3. Что нужно исправить
            4. Можно ли мержить? (да/нет и почему)")
          echo "$SUMMARY" >> full_review.txt

      - name: Опубликовать полное ревью
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('full_review.txt', 'utf8');
            const issueNumber = '${{ steps.pr_data.outputs.ISSUE_NUMBER }}';
            let body = review;
            if (issueNumber && issueNumber !== '') {
              body += `\n\n**Связанный тикет:** #${issueNumber}`;
            }
            body += '\n\n---\n* Проверено по ТЗ из `docs/tz.md`*';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  review-all-docs:
    needs: load-tz
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.title, 'docs')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Установка и запуск Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          curl --retry 5 --retry-delay 5 \
            --retry-connrefused http://localhost:11434/api/tags
          ollama pull llama2:7b

      - name: Проверка всей документации
        run: |
          echo "# Полная проверка документации" > docs_full_review.txt
          echo "" >> docs_full_review.txt
          echo "**Ветка:** develop" >> docs_full_review.txt
          echo "**Путь:** /docs/" >> docs_full_review.txt
          echo "" >> docs_full_review.txt

          DOCS_FILES=$(find docs -name "*.md" | sort)

          for doc in $DOCS_FILES; do
            echo "## Проверка: \`$doc\`" >> docs_full_review.txt
            echo "" >> docs_full_review.txt

            if [ -f "$doc" ]; then
              CONTENT=$(cat "$doc" | head -1000)
              case "$doc" in
                *tz.md*)
                  REVIEW=$(ollama run llama2:7b \
                    "Проверь структуру ТЗ:
          Должны быть разделы:
          1. Глоссарий
          2. Продуктовое описание
          3. Техническое описание
          4. Условия эксплуатации
          5. Правила выгрузки
          6. История изменений
          Содержимое:
          $CONTENT
          Что пропущено?")
                            ;;
                          *endpoints.md*)
                            REVIEW=$(ollama run llama2:7b \
                              "Проверь документацию API:
          Должны быть эндпоинты для:
          - /auth
          - /queues
          - /slots
          - /lessons
          - /users
          Содержимое:
          $CONTENT
          Все ли описаны?")
                            ;;
                          *)
                            REVIEW=$(ollama run llama2:7b \
                              "Оцени качество документации.
          Содержимое:
          $CONTENT
          Ответь на только на русском языке.")
                            ;;
                        esac
                        echo "$REVIEW" >> docs_full_review.txt
                        echo "" >> docs_full_review.txt
                        echo "---" >> docs_full_review.txt
                      fi
                    done

      - name: Опубликовать ревью документации
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('docs_full_review.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review + '\n\n* Проверка документации завершена*'
            })
